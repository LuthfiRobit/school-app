<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - Portal SPMB Tunas Luhur</title>
  <link rel="shortcut icon" type="image/x-icon" href="../assets/img/logo/logo-sma.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/typography.css">
  <link rel="stylesheet" href="../assets/css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/index.css">
  <link rel="stylesheet" href="../assets/css/portal.css">
</head>
<body class="auth-bg">
  <div class="auth-wrapper">
    <!-- Left Brand Side (Visible on Desktop) -->
    <div class="auth-brand">
      <img src="../assets/img/logo/logo2.png" alt="Tunas Luhur" class="brand-logo" data-aos="zoom-in" data-aos-duration="800">
      <h1 class="brand-title" data-aos="fade-up" data-aos-duration="800" data-aos-delay="100">Pintu Masa Depan Anda</h1>
      <p class="brand-subtitle" data-aos="fade-up" data-aos-duration="800" data-aos-delay="200">
        Bergabunglah bersama SMA Tunas Luhur dan kembangkan potensi terbaik Anda melalui pendidikan karakter dan akademik yang unggul.
      </p>
    </div>

    <!-- Right Form Side -->
    <div class="auth-content">
      <div class="auth-card" data-aos="fade-up" data-aos-duration="600">
        <div class="text-center mb-4 d-lg-none">
          <a href="../index.html">
            <img src="../assets/img/logo/logo2.png" alt="Logo Tunas Luhur" style="height: 48px; margin-bottom: 1rem;">
          </a>
        </div>
        
        <div class="mb-4">
          <h2 class="auth-title">Selamat Datang</h2>
          <p class="auth-subtitle">Masuk ke portal pendaftaran Anda</p>
        </div>

        <form action="dashboard.html" x-data="{ showPassword: false }">
          <div class="mb-3">
            <label for="email" class="form-label">Alamat Email</label>
            <div class="input-group">
              <span class="input-group-text border-end-0"><i class="fa-regular fa-envelope"></i></span>
              <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="nama@email.com" required>
            </div>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between mb-1">
              <label for="password" class="form-label mb-0">Password</label>
              <a href="lupa-password.html" class="auth-link text-primary-600">Lupa password?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text border-end-0"><i class="fa-solid fa-lock"></i></span>
              <input :type="showPassword ? 'text' : 'password'" class="form-control border-start-0 border-end-0 px-0" id="password" placeholder="Masukkan password" required>
              <button class="btn btn-outline-secondary border-start-0 bg-transparent" type="button" @click="showPassword = !showPassword">
                <i class="fa-regular" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>

          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label text-muted" for="rememberMe">Ingat sesi saya</label>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2">Masuk ke Portal</button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="text-muted mb-0">Belum memiliki akun? <a href="daftar.html" class="auth-link text-secondary-600">Buat Akun Baru</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/vendor/bootstrap.bundle.min.js"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- AOS Animation -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ once: true });
  </script>
</body>
</html>
